# Builds and tests WALLNut on Windows, Linux and macOS for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs the tests first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build WallNut.slnx -c Release

      - name: Test
        run: dotnet test WallNut.slnx -c Release --no-build

      - name: Check the Linux install script
        if: runner.os == 'Linux'
        run: |
          bash -n packaging/linux/install.sh
          bash -n packaging/linux/uninstall.sh
          bash -n packaging/macos/install.sh
          bash -n packaging/macos/uninstall.sh
