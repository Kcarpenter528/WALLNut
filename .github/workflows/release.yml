# Builds the downloads for every platform. Push a tag like v0.2.0 to make a (draft) GitHub
# release with them, or run it by hand (Actions > Release > Run workflow) for test builds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a test build (no release is made)
        required: true
        default: 0.0.0-dev

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:REF_TYPE -eq 'tag' ? $env:REF_NAME.TrimStart('v') : $env:INPUT_VERSION
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "'$v' isn't a version like 1.2.3 or 1.2.3-beta.1." }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build the downloads
        shell: pwsh
        run: ./packaging/build.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION

      # ---- Install each installer on this runner and check the service comes up ----------

      - name: Try the Windows setup program
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=setup.log' -Wait
          Get-Content "$env:ProgramFiles\WALLNut\install.log" -ErrorAction SilentlyContinue
          (Get-Service WALLNut).WaitForStatus('Running', '00:00:30')
          & "$env:ProgramFiles\WALLNut\Service\WallNut.Service.exe" --check
          if ($LASTEXITCODE) { throw "--check failed ($LASTEXITCODE)" }
          Start-Process "$env:ProgramFiles\WALLNut\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          if (Get-Service WALLNut -ErrorAction SilentlyContinue) { throw 'The service is still there after uninstalling.' }

      - name: Try the .deb
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get install -y ./dist/*.deb
          systemctl is-active wallnut
          sudo /opt/wallnut/service/WallNut.Service --check
          sudo apt-get purge -y wallnut
          test ! -e /opt/wallnut && test ! -e /etc/wallnut

      - name: Try the .rpm (Fedora)
        if: matrix.rid == 'linux-x64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -euxc '
            dnf install -y -q /dist/*.rpm
            /opt/wallnut/service/WallNut.Service --check
            dnf remove -y -q wallnut
            test ! -e /opt/wallnut'

      - name: Try the .pkg
        if: matrix.rid == 'osx-arm64'
        run: |
          sudo installer -pkg dist/*.pkg -target / || { cat /Library/Logs/WALLNut/install.log; exit 1; }
          cat /Library/Logs/WALLNut/install.log
          sudo launchctl print system/wallnut.service | grep -E 'state|pid'
          sudo /usr/local/wallnut/service/WallNut.Service --check
          sudo /usr/local/wallnut/uninstall.sh --remove-settings

      # ---- One artifact per file, named after it ------------------------------------------

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: WALLNut-${{ matrix.rid }}-setup.exe
          path: dist/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: WALLNut-${{ matrix.rid }}.zip
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: WALLNut-${{ matrix.rid }}.pkg
          path: dist/*.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: WALLNut-${{ matrix.rid }}.deb
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: WALLNut-${{ matrix.rid }}.rpm
          path: dist/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: WALLNut-${{ matrix.rid }}.tar.gz
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WALLNut-*
          path: dist
          merge-multiple: true

      # Release files drop the version (WALLNut-win-x64-setup.exe), so the README's
      # .../releases/latest/download/<file> links always point at the newest release.
      - name: Name the files for "latest" links
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for f in WALLNut-*; do mv "$f" "${f/-$version/}"; done
          ls -l

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "WALLNut ${TAG#v}" --generate-notes
